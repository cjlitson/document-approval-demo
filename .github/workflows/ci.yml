name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore DocumentApprovalDemo.sln
      - run: dotnet build DocumentApprovalDemo.sln --configuration Release --no-restore
      - run: dotnet test DocumentApprovalDemo.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
